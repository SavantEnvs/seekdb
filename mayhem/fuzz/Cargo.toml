[package]
name = "seekdb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
json = { path = "../../rust/json" }
xml-parser = { path = "../../rust/xml-parser" }
regex-engine = { path = "../../rust/regex-engine" }
# Generated by gen_sqlnio_shim.sh (called from mayhem/build.sh) over rust/sql-nio.
sql-nio-shim = { path = "sqlnio-shim" }
# Links upstream rust/json/src/schema_pattern.cpp (the JSON Schema `pattern` compiler).
schema-pattern-shim = { path = "schema-pattern-shim" }

# Standalone crate: keep it out of upstream's root workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "json_parse"
path = "fuzz_targets/json_parse.rs"
test = false
doc = false

[[bin]]
name = "json_path"
path = "fuzz_targets/json_path.rs"
test = false
doc = false

[[bin]]
name = "json_binary"
path = "fuzz_targets/json_binary.rs"
test = false
doc = false

[[bin]]
name = "json_schema"
path = "fuzz_targets/json_schema.rs"
test = false
doc = false

[[bin]]
name = "xml_parse"
path = "fuzz_targets/xml_parse.rs"
test = false
doc = false

[[bin]]
name = "regex"
path = "fuzz_targets/regex.rs"
test = false
doc = false

[[bin]]
name = "sql_nio"
path = "fuzz_targets/sql_nio.rs"
test = false
doc = false
